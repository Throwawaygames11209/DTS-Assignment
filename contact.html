<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <a href="index.html" class="logo"><img src="logo.png" alt="Nature Protection Logo"></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="information.html">Information</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>
    </div>
    <main>
        <section class="contact">
            <h1>Contact Us</h1>
            <p>
                Have a question about Tiritiri Matangi or New Zealand's
                native wildlife? Fill in the form below.
            </p>
            <form action="https://formspree.io/f/mkjnwjok" method="POST">
                <label for="fname">First Name *</label>
                <input type="text" id="fname" name="first-name" required>
                <label for="lname">Last Name *</label>
                <input type="text" id="lname" name="last-name" required>
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" required>
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6"></textarea>
                <div class="form-buttons">
                    <button type="reset">Clear</button>
                    <button type="submit">Submit</button>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <p>© 2026 Keagan Bresser - 11 DTS Project</p>
    </footer>
</body>
</html>
